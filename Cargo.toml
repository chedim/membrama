[package]
name = "membrama"
version = "0.0.0"
edition = "2021"
description = "A GraphLink peer on llama.cpp that banks a model's cache for an entity's text and loads it instead of reading the text again"
license = "MIT"
publish = false

[dependencies]
sha2 = "0.10"
serde_json = "1"
minijinja = { version = "=3.1.0", features = ["json", "serde", "preserve_order"] }
minijinja-contrib = { version = "=3.1.0", features = ["pycompat"] }
graphlink-core = "0.1.3"
graphlink-shm = "0.1.3"
llama-cpp-2 = { version = "=0.1.161", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["metal"] }
